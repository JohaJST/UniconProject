<html lang="en">
{% load static %}
{% load i18n %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ APP_NAME }} // Self-Check</title>
    <link rel="stylesheet" href="{% static 'module3test/style.css' %}">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <!-- Подключаем библиотеку для салюта -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- start Quiz button -->
    <div class="start_btn"><button>{% trans 'startQuiz' %}</button></div>
    
    <!-- Info Box (теперь с полями для ввода) -->
    <div class="info_box">
        <div class="info-title"><span>{% trans 'infoTitle' %}</span></div>
        <div class="info-list">
            <div class="input-group">
                <label for="first_name">{% trans 'firstName' %}</label>
                <input type="text" id="first_name" placeholder="{% trans 'firstNameInput' %}" required>
            </div>
            <div class="input-group">
                <label for="last_name">{% trans 'lastName' %}</label>
                <input type="text" id="last_name" placeholder="{% trans 'lastNameInput' %}" required>
            </div>
        </div>
        <div class="buttons">
            <button class="quit"><a href="{% url 'about' %}" style="text-decoration:none; color:inherit;">{% trans 'quit' %}</a></button>
            <button class="restart" id="start_quiz_btn">{% trans 'next' %}</button>
        </div>
    </div>
    
    <!-- Quiz Box -->
    <div class="quiz_box">
        <header>
            <div class="title">{{ APP_NAME }}</div>
        </header>
        <section>
            <div class="que_text"></div>
            <div class="option_list"></div>
        </section>
        <footer>
            <div class="total_que"></div>
            <button class="next_btn">{% trans 'next' %}</button>
        </footer>
    </div>
    
               <!-- Result Box -->
               <div class="result_box">
                       <div class="icon" id="result_icon">
                           <i class="fas fa-crown"></i>
                       </div>
                       <!-- Title (Status) -->
                       <div class="complete_text" id="status_text">{% trans 'completeText' %}</div>
                       <!-- Subtitle -->
                       <div class="score_text" id="subtitle_text">
                           <!-- Сюда подставится текст через JS -->
                       </div>
                       <div class="buttons">
                           <button class="restart" id="retake_btn">{% trans 'retake' %}</button>
                           <button class="quit" id="final_quit_btn">{% trans 'quit' %}</button>
                       </div>
                       <!-- Скрытая форма, нужна только чтобы взять CSRF токен для JS запроса -->
                       <form id="results-id" style="display: none;">
                           {% csrf_token %}
                       </form>
                   </div>
                   
    <!-- Inside this JavaScript file I've coded all Quiz Codes -->
    <script src="{% static 'module3test/script.js' %}"></script>
    <script>
    const homelink = "{% url 'about'|escapejs %}";
    const fioReq = "{% trans 'fioReq'|escapejs %}";
    const statusNice = "{% trans 'statusNice'|escapejs %}";
    {% trans "statusBad" as statusBad_t %}
    const statusBad = "{{ statusBad_t|escapejs }}";
    const statusNorm = "{% trans 'statusNorm'|escapejs %}";
    const quesOf = "{% trans 'quesOf'|escapejs %}";
    const subtitleTemplate = "{% trans 'resultText'|escapejs %}";
    </script>
    <script>
        // Генерируем массив вопросов из данных, пришедших из Python (questions_list)
        let questions = [
            {% for q in questions %}
            {
                numb: {{ q.id }},
                question: "{{ q.text|escapejs }}",
                img: {% if q.img %}"{{ q.img.url }}"{% else %}null{% endif %},
                
                options: [
                    {% for a in q.answers %}
                    {
                        text: "{{ a.text|escapejs }}",
                        img: {% if a.img %}"{{ a.img.url }}"{% else %}null{% endif %}
                    }{% if not forloop.last %},{% endif %}
                    {% endfor %}
                ],
                
                {% for a in q.answers %}
                    {% if a.is_correct %}
                        answer: "{{ a.text|escapejs }}"
                    {% endif %}
                {% endfor %}
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ];
    
  // you can uncomment the below codes and make duplicate as more as you want to add question
  // but remember you need to give the numb value serialize like 1,2,3,5,6,7,8,9.....

  //   {
  //   numb: 6,
  //   question: "Your Question is Here",
  //   answer: "Correct answer of the question is here",
  //   options: [
  //     "Option 1",
  //     "option 2",
  //     "option 3",
  //     "option 4"
  //   ]
  // },

    </script>
</body>
</html>
