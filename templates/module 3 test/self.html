{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Self Study{% endblock %}

{% block header %}
    <style>
        html body,
        html body *:not(i):not([class*="fa-"]):not(svg):not(svg *) {
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", cursive, sans-serif !important;
        }
    </style>
{% endblock %}

{% block body %}
    <div id="selfStudyRoot">{{ rendered_html|safe }}</div>

    <script src="{% static 'rain.js' %}"></script>
    <script>
    (function () {
        function go() { window.initDigitalRainInBlocks(document.getElementById('selfStudyRoot')); }
        if (document.readyState === 'complete') go();
        else window.addEventListener('load', go);
    })();
    </script>
{% endblock %}
