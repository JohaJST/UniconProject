{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Self Study{% endblock %}

{% block header %}
    <style>
        html body,
        html body *:not(i):not([class*="fa-"]):not(svg):not(svg *) {
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", cursive, sans-serif !important;
        }
    </style>
{% endblock %}

{% block body %}
    <div id="selfStudyRoot">{{ rendered_html|safe }}</div>

    <script src="{% static 'rain.js' %}"></script>
    <script>
        window.addEventListener('load', function () {
            window.initDigitalRainBackground({ theme: 'auto', edgeMin: 0.4 });
        });
    </script>
{% endblock %}
