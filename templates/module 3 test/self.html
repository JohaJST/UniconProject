{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Self Study{% endblock %}

{% block header %}
    <link rel="stylesheet" href="{% static 'self_study.css' %}" />
    <style>
        html body,
        html body *:not(i):not([class*="fa-"]):not(svg):not(svg *):not(code):not(pre):not(kbd):not(samp) {
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", cursive, sans-serif !important;
        }
    </style>
{% endblock %}

{% block body %}
    <!-- Reading progress -->
    <div class="sv-progress" aria-hidden="true"><span id="svProgressBar"></span></div>

    <!-- Фон: аврора-кулисы + canvas с «дождём» -->
    <div class="sv-bg" aria-hidden="true"></div>
    <canvas id="svRain" aria-hidden="true"></canvas>

    <div class="sv-page">
        <div class="sv-wrap">

            <!-- Hero: тонкая плашка (заголовок страницы приходит из БД) -->
            <!--<div class="sv-hero">
                <span class="sv-badge"><i></i>MODULE 03 • SELF STUDY</span>
                <p class="sv-hero__meta" id="svReadMeta"></p>
                <a class="sv-cta" href="{% url 'self_check' %}">
                    Self Check
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </a>
            </div>-->

            <!-- Парящий лист чтения -->
            <div class="sv-sheet" id="selfStudyRoot">
                <div class="self-content">{{ rendered_html|safe }}</div>
            </div>
        </div>
    </div>

    <button type="button" class="sv-top" id="svTop" aria-label="Top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>

    <script src="{% static 'self_rain.js' %}"></script>
    <script>
    (function () {
        'use strict';
        var bar  = document.getElementById('svProgressBar');
        var top  = document.getElementById('svTop');
        var root = document.getElementById('selfStudyRoot');
        var meta = document.getElementById('svReadMeta');

        // ~180 слов/мин → оценка времени чтения
        if (root && meta) {
            var words = (root.innerText || '').trim().split(/\s+/).filter(Boolean).length;
            if (words > 20) meta.textContent = '≈ ' + Math.max(1, Math.round(words / 180)) + ' min • ' + words + ' words';
        }

        var ticking = false;
        function update() {
            ticking = false;
            var doc = document.documentElement;
            var max = (doc.scrollHeight - window.innerHeight) || 1;
            var p = Math.min(1, Math.max(0, window.pageYOffset / max));
            if (bar) bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
            if (top) top.classList.toggle('is-visible', window.pageYOffset > 600);
        }
        window.addEventListener('scroll', function () {
            if (!ticking) { ticking = true; requestAnimationFrame(update); }
        }, { passive: true });
        window.addEventListener('resize', update);
        update();

        if (top) top.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Движок дождя (отдельный от rain.js)
        window.addEventListener('load', function () {
            if (window.initSelfStudyRain) window.initSelfStudyRain({ canvasId: 'svRain', contentMax: 900 });
        });
    })();
    </script>
{% endblock %}
