{% extends 'pages/dashboard/base.html' %}

{% block title %}Редактировать поток{% endblock %}
{% block page_title %}Редактировать поток{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white">Редактировать поток</h1>
        <a href="{% url 'action' status='view' path='potok' pk=potok.id %}"
           class="inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-white transition-colors mt-1">
            <i class="fa-solid fa-arrow-left text-xs"></i>
            Назад к потоку
        </a>
    </div>

    {% if error %}
    <div class="mb-4 bg-rose-500/10 border border-rose-500/40 text-rose-300 text-sm rounded-xl px-4 py-3">
        <i class="fa-solid fa-triangle-exclamation mr-1.5"></i>{{ error }}
    </div>
    {% endif %}

    <div class="bg-slate-800 rounded-2xl border border-slate-700/50 p-8">
        <form method="post" action="{% url 'action' status='edit' path='potok' pk=potok.id %}">
            {% csrf_token %}

            <div class="mb-6">
                <label class="text-sm font-medium text-slate-300 mb-1.5 block" for="potok-start">
                    Дата начала <span class="text-rose-400">*</span>
                </label>
                <input id="potok-start"
                       type="date"
                       name="potok_start"
                       required
                       value="{{ post_data.potok_start|default:potok.start|date:'Y-m-d' }}"
                       class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-2.5
                              text-white placeholder-slate-500
                              focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500
                              transition-colors [color-scheme:dark]">
            </div>

            <div class="mb-6">
                <label class="text-sm font-medium text-slate-300 mb-1.5 block" for="potok-end">
                    Дата конца <span class="text-rose-400">*</span>
                </label>
                <input id="potok-end"
                       type="date"
                       name="potok_end"
                       required
                       value="{{ post_data.potok_end|default:potok.end|date:'Y-m-d' }}"
                       class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-2.5
                              text-white placeholder-slate-500
                              focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500
                              transition-colors [color-scheme:dark]">
            </div>

            <div class="flex items-center gap-3">
                <button type="submit"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl
                               font-medium transition-colors inline-flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Сохранить
                </button>
                <a href="{% url 'action' status='view' path='potok' pk=potok.id %}"
                   class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl
                          transition-colors text-sm">
                    Отмена
                </a>
            </div>
        </form>
    </div>

</div>
{% endblock %}
