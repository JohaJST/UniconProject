{% extends 'pages/dashboard/base.html' %}

{% block title %}Редактировать класс{% endblock %}
{% block page_title %}Редактировать класс{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

    <!-- Page heading -->
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-white">Редактировать класс</h1>
        <a href="{% url 'action' status='view' path='classroom' pk=classroom.id %}"
           class="inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-white transition-colors mt-1">
            <i class="fa-solid fa-arrow-left text-xs"></i>
            Назад к классу
        </a>
    </div>

    <!-- Card -->
    <div class="bg-slate-800 rounded-2xl border border-slate-700/50 p-8">
        <form method="post" action="{% url 'action' status='edit' path='classroom' pk=classroom.id %}">
            {% csrf_token %}

            <!-- Classroom name -->
            <div class="mb-6">
                <label class="text-sm font-medium text-slate-300 mb-1.5 block" for="classroom-name">
                    Название класса <span class="text-rose-400">*</span>
                </label>
                <input id="classroom-name"
                       type="text"
                       name="classroom_name"
                       placeholder="Например: 9А..."
                       required
                       value="{{ post_data.classroom_name|default:classroom.name }}"
                       class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-2.5
                              text-white placeholder-slate-500
                              focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500
                              transition-colors">
            </div>

            <!-- Submit + Cancel -->
            <div class="flex items-center gap-3">
                <button type="submit"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl
                               font-medium transition-colors inline-flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Сохранить
                </button>
                <a href="{% url 'action' status='view' path='classroom' pk=classroom.id %}"
                   class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl
                          transition-colors text-sm">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    /* ─── Toasts (1-в-1 из subject_edit.html/self_check_form.html) ─── */
    function getToastContainer() {
        let container = document.getElementById('toastContainer');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'fixed top-4 right-4 z-[200] flex flex-col gap-2 items-end';
            document.body.appendChild(container);
        }
        return container;
    }

    function showToast(message, type = 'error') {
        const container = getToastContainer();
        const toast = document.createElement('div');
        const colors = type === 'success'
            ? 'bg-emerald-600 border-emerald-500'
            : 'bg-rose-600 border-rose-500';
        toast.className = `${colors} text-white text-sm font-medium px-4 py-3 rounded-xl
                            shadow-xl border max-w-xs
                            translate-x-4 opacity-0 transition-all duration-300 ease-out`;
        toast.textContent = message;
        container.appendChild(toast);

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-4', 'opacity-0');
            });
        });

        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-x-4');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    {% if error %}
    document.addEventListener('DOMContentLoaded', () => {
        showToast("{{ error|escapejs }}", 'error');
    });
    {% endif %}
</script>
{% endblock %}
